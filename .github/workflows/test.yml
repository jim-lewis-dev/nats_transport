name: Test
on: [push, pull_request]
jobs:
  transport:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
        nats: ["2.15.0", "2.16.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y nats-server openssl
      - run: python -m pip install . nats-py==${{ matrix.nats }}
      - run: python -W error::RuntimeWarning -m unittest -v
        env:
          REQUIRE_NATS_SERVER: "1"
